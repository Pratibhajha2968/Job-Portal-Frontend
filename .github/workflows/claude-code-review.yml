name: Claude Auto Review & Fix

on:
  pull_request:
    types: [opened, synchronize]

# Cancel an older run if you push again quickly
concurrency:
  group: claude-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write        # lets Claude commit & push fixes to the branch
  pull-requests: write   # lets Claude post review comments
  issues: write
  id-token: write

jobs:
  review-and-fix:
    # Don't re-trigger on Claude's own fix commits (prevents loops)
    if: github.actor != 'claude[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are reviewing pull request #${{ github.event.pull_request.number }}
            on branch "${{ github.head_ref }}". Follow the rules in CLAUDE.md.

            1. Review the changed files for logic errors, broken routes/links,
               state-management bugs, security issues, missing error handling,
               and dead code.
            2. For clear-cut bugs, FIX them: edit the files, then commit and push
               to this same branch with messages like "fix: <what> (Claude auto-fix)".
            3. For risky or design-level issues, do NOT change code — describe
               them in your summary instead.
            4. Post ONE PR comment summarizing what you fixed and what still
               needs human attention.
          claude_args: |
            --max-turns 25
